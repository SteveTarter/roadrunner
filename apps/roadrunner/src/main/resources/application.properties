spring.config.import=optional:secrets.properties

spring.application.name=roadrunner
spring.data.rest.base-path=/
spring.profiles.active=dev

mapbox.api.url=https://api.mapbox.com/

management.server.port=8081
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

com.tarterware.redis.host=127.0.0.1
com.tarterware.redis.port=6379

com.tarterware.roadrunner.vehicle-update-period=250ms

com.tarterware.roadrunner.jitter-stat-capacity=200
com.tarterware.roadrunner.playback-cache-timeout=1m
com.tarterware.roadrunner.playback-cache-size=100
com.tarterware.roadrunner.usage-limits.default-daily-vehicle-starts=30
com.tarterware.roadrunner.usage-limits.redis-key-prefix=roadrunner:usage:vehicle-starts
com.tarterware.roadrunner.usage-limits.counter-ttl-hours=24

com.tarterware.roadrunner.cors.allowed-origins=http://localhost:3000,https://roadrunner-view.tarterware.info,https://roadrunner-view.tarterware.com

# Messaging framework selector
com.tarterware.roadrunner.messaging.kafka.enabled=true

# Enable to display all messages posted to topic
com.tarterware.roadrunner.messaging.kafka.debug.enabled=false

# Settings for updating the Kubernetes secret
prometheus.secret.namespace=roadrunner
prometheus.secret.name=prometheus-token-secret

# Silence these noisy classes.
logging.level.org.apache.kafka.clients.consumer.internals.LegacyKafkaConsumer=WARN
logging.level.org.apache.kafka.clients.consumer.internals.SubscriptionState=WARN
logging.level.org.apache.kafka.clients.consumer.internals.ClassicKafkaConsumer=WARN

# Uncomment to display updateVehicle execution statistics in log.
# logging.level.com.tarterware.roadrunner.components.VehicleManager=DEBUG

# logging.level.com.tarterware.roadrunner.adapters.kafka.KafkaVehicleEventConsumer=DEBUG
# logging.level.com.tarterware.roadrunner.adapters.kafka.KafkaVehicleEventPublisher=DEBUG

# logging.level.com.tarterware.roadrunner.controllers.PlaybackController=DEBUG

# Kafka configuration
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.properties.socket.connection.setup.timeout.ms=30000
spring.kafka.properties.request.timeout.ms=60000
spring.kafka.listener.concurrency=3
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.properties.batch.size=65536
spring.kafka.producer.properties.compression.type=lz4
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=200
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.tarterware.roadrunner.messaging
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.consumer.properties.spring.json.value.default.type=com.tarterware.roadrunner.messaging.VehiclePositionEvent

# Reduce the time the broker waits for a consumer to respond
spring.kafka.consumer.properties.heartbeat.interval.ms=3000
spring.kafka.consumer.properties.session.timeout.ms=10000

com.tarterware.roadrunner.kafka.topic.vehicle-position=vehicle.position.v1
com.tarterware.roadrunner.kafka.topic.creation-request=vehicle.creation-request.v1
com.tarterware.roadrunner.kafka.topic.simulation-start=vehicle.simulation-start.v1

# PostGIS Persistence properties
com.tarterware.roadrunner.persistence.postgis.enabled=false
com.tarterware.roadrunner.persistence.postgis.auto-exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration
spring.autoconfigure.exclude=${com.tarterware.roadrunner.persistence.postgis.auto-exclude}

spring.datasource.url=jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DB:roadrunner_gis}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:roadrunner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:roadrunner}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SQL Initialization script configuration (for enabling extensions)
spring.sql.init.mode=always
spring.sql.init.username=postgres
spring.sql.init.password=${SPRING_SQL_INIT_PASSWORD:roadrunner}
spring.sql.init.schema-locations=classpath:schema-postgis.sql

# Allow bean definition overriding for test configurations
spring.main.allow-bean-definition-overriding=true

